<div style="display: flex;
    width: -webkit-fill-available;
    justify-content: end;
    margin-right: 1rem;
    margin-bottom: .5rem;">
    <!-- multi select options -->
    <div ng-show="is_note_multi_select_on" class="flex-col gap-1 orange p-1 popup_style">
        <div ng-click="bulk_action(CONST.COMPLETE)">✅ Complete</div>
        <div ng-click="bulk_action(CONST.MERGE)">🔀 Merge</div>
        <div ng-click="bulk_action(CONST.MOVE)">🚚 Move</div>
        <div ng-click="bulk_action(CONST.REMOVE)">🗑️ Remove</div>
        <div ng-click="bulk_action(CONST.CANCEL)">❌ Cancel</div>
    </div>
</div>

<!-- bottom button -->
<div 
ng-show="!is_note_multi_select_on"
class="flex-row p-1/2 justify-space-between gap-1 rounded-full border blur">
    <!-- create notebook button -->
    <div ng-click="open_notebook_popup('create');"
        class="button rounded-full clickable orange gap-1 icon-btn-padding  col-reverse">
        <span class="nav_btn_icon">📖</span>
    </div>
    <!-- create note button -->
    <div ng-click="open_create_note_popup()"
        class="button rounded-full clickable orange gap-1 icon-btn-padding  col-reverse">
        <span class="nav_btn_icon">📝</span>
        <!-- <span>Note</span> -->
    </div>
    <!-- system var button -->
    <div ng-click="open_create_var_popup()"
        class="button rounded-full clickable orange gap-1 icon-btn-padding  col-reverse">
        <span class="nav_btn_icon">🎛️</span>
    </div>
    <!-- view notebooks button -->
    <div ng-hide="show_view=='notebook'" ng-click="set_view('notebook')"
        class="button rounded-full clickable orange gap-1 icon-btn-padding  col-reverse">
        <span class="nav_btn_icon">⬅️</span>
    </div>
</div>
