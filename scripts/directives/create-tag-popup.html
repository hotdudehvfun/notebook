<!-- create tag popup -->
<div 
    class="create-notebook-popup flex-col relative rounded-2 scroll gap-2 popup_style">
    <!-- title of popup -->
    <div class="flex-row align-center gap-1">
        <span class="text-lg">📚</span>
        <span>Create new tag</span>
    </div>

    <!-- content of popup -->
    <div class="flex-col w-full gap-2 align-center">
        <!-- name for notebook  -->
        <input
            maxlength="30" 
            type="text" 
            name="new_tag_name"
            class="add-new-list-title" 
            ng-model="new_tag_name"
            ng-attr-placeholder="Create new tag to group notebooks" autofocus />
    </div>

    <!-- action buttons -->
    <div class="flex-row gap-1 space-between mt-2">
        <div ng-click="show_dialog=false; new_tag_name=''" class="button clickable rounded-full gap-1 red">
            Close
        </div>
        <div
            ng-class="{'orange':new_tag_name.length>1}"
            ng-click="create_tag()"
            class="button clickable rounded-full gap-1 transition not-active">
            Create
        </div>
    </div>
</div>
