<div 
    class="new_notebook_popup_child popup_style"
    ng-click="$event.stopPropagation()">
         <div class="flex-col align-center gap-1">
            <div class="flex-row align-center gap-1 m-2 w-full">
             <span class="text-lg">🔐</span>
             <div class="text-120">Enter password</div>
            </div>
             <input
                name="password"
                type="password"
                id="password"
                class="add-new-list-title"
                ng-model="password" 
                placeholder="Enter the password"></input>
            <div class="flex-row space-between m-2">
                <span
                    ng-click="show_dialog=false" 
                    class="button text-red-500">
                    Cancel
                </span>
                <span 
                    ng-hide="notebook.is_locked" 
                    ng-click="lock_data()" 
                    ng-class="{'orange':password.length>0}"
                    class="button not-active transition">
                    Lock Data
                </span>
                <span 
                    ng-show="notebook.is_locked" 
                    ng-click="unlock_data()" 
                    ng-class="{'orange':password.length>0}"
                    class="button not-active transition">
                    Unlock Data
                </span>
            </div>
         </div>
        </div>
