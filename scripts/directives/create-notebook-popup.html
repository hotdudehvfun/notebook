<!-- create and rename notebook dialog controller -->
<!-- create/rename notebook popup -->
<div 
    class="create-notebook-popup flex-col relative rounded-2 scroll gap-2 popup_style"
    ng-click="$event.stopPropagation()">
    <!-- title of popup -->
    <div class="flex-row align-center gap-1">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M3 4C3 2.89543 3.89543 2 5 2H13C14.1046 2 15 2.89543 15 4V16C15 17.1046 14.1046 18 13 18H9.74284C9.99647 17.6929 10.2174 17.3578 10.4003 17H13C13.5523 17 14 16.5523 14 16V4C14 3.44772 13.5523 3 13 3H5C4.44772 3 4 3.44772 4 4V9.20703C3.65136 9.30564 3.31679 9.43777 3 9.59971V4ZM5.5 4.5C5.22386 4.5 5 4.72386 5 5V7C5 7.27614 5.22386 7.5 5.5 7.5H12.5C12.7761 7.5 13 7.27614 13 7V5C13 4.72386 12.7761 4.5 12.5 4.5H5.5ZM6 6.5V5.5H12V6.5H6ZM16.5 6H16V8.5H16.5C16.7761 8.5 17 8.27614 17 8V6.5C17 6.22386 16.7761 6 16.5 6ZM16.5 9.5H16V12H16.5C16.7761 12 17 11.7761 17 11.5V10C17 9.72386 16.7761 9.5 16.5 9.5ZM16.5 13H16V15.5H16.5C16.7761 15.5 17 15.2761 17 15V13.5C17 13.2239 16.7761 13 16.5 13ZM5.5 19C7.98528 19 10 16.9853 10 14.5C10 12.0147 7.98528 10 5.5 10C3.01472 10 1 12.0147 1 14.5C1 16.9853 3.01472 19 5.5 19ZM5.5 12C5.77614 12 6 12.2239 6 12.5V14H7.5C7.77614 14 8 14.2239 8 14.5C8 14.7761 7.77614 15 7.5 15H6V16.5C6 16.7761 5.77614 17 5.5 17C5.22386 17 5 16.7761 5 16.5L5 15H3.5C3.22386 15 3 14.7761 3 14.5C3 14.2239 3.22386 14 3.5 14H5V12.5C5 12.2239 5.22386 12 5.5 12Z" fill="dodgerblue"/>
</svg>

        <span>{{create_notebook_obj[create_notebook_obj.action].title}}</span>
    </div>

    <!-- content of popup -->
    <div class="flex-col w-full gap-2 align-center">
        <!-- emoji icon for notebook -->
        <input maxlength="2" type="text" name="notebook_icon" class="list_icon_input" ng-model="new_notebook_icon"
            placeholder="Icon Emoji" />
        
        <!-- name for notebook  -->
        <input
            maxlength="30" 
            type="text" 
            name="notebook_name" 
            ng-keyup="handle_input_on_notebook($event)"
            class="add-new-list-title" 
            ng-model="new_notebook_name"
            ng-attr-placeholder="{{create_notebook_obj[create_notebook_obj.action].placeholder}}" autofocus />
    </div>

    <!-- action buttons -->
    <div class="flex-row gap-1 space-between mt-2">
        <div 
            ng-click="close_dialog()" 
            class="button clickable rounded-full gap-1 red">
            Close
        </div>
        <div
            ng-show="create_notebook_obj.action=='create'" 
            ng-class="{'orange':new_notebook_name.length>1}"
            ng-click="handle_click_on_create_notebook_button()"
            class="button clickable rounded-full gap-1 transition not-active">
            Create
        </div>
        <div ng-show="create_notebook_obj.action=='rename'" ng-class="{'orange':new_notebook_name.length>1}"
            ng-click="rename_notebook()" class="button clickable rounded-full gap-1 transition not-active">
            Rename
        </div>
    </div>
</div>
