<!DOCTYPE html>
<html lang="en">

<head>
    <title>NoteBook</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    <meta content="todo app" name="keywords">
    <meta name="description" content="NoteBook app">
    <meta http-equiv="cache-control" content="max-age=8000" />
    <meta http-equiv="cache-control" content="Private" />
    <link rel="apple-touch-icon" sizes="180x180" href="img/ios/180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/ios/32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/ios/16.png">
    <link rel="icon" href="/img/ios/180.png">
    <link rel="manifest" href="manifest.json">
    <meta id="theme-color" name="theme-color" content="#272727" />
    <meta name="mobile-web-app-capable" content="yes">
    <!-- development -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/custom_styles.css">
</head>

<body ng-app="notebook_app" ng-controller='main_controller'>
    <div class="main-container">
        <!-- top bar -->
        <top-bar class="topbar" ng-show="show_topbar()"></top-bar>
        <!-- content bar -->
        <div class="content">
            <notebooks-list ng-show="show_view==CONST.VIEW_NOTEBOOK"></notebooks-list>
            <notes-list ng-show="show_view==CONST.VIEW_NOTE"></notes-list>

            <div ng-controller="var_controller">
                <system-var-list ng-show="show_var_list">
                </system-var-list>
                <!-- create-var-popup -->
                <popup-Create-Var style="bottom: 30vh;" class="popup" ng-show="show_dialog" ng-click="show_dialog=false">
                </popup-Create-Var>
            </div>
            <!-- manage notebook tags -->
            <div ng-controller="tag_controller">
                <tags-list ng-show="show_tag_list"></tags-list>
                <popup-create-tag style="bottom: 30vh;" ng-show="show_dialog" class="popup">
                </popup-create-tag>
            </div>

            <!-- create note view -->
            <create-note-view ng-init="init()" ng-controller="create_note_controller" ng-show="show_dialog">
            </create-note-view>

            <view-bin
                ng-controller="bin_controller"
                ng-show="show_dialog">
            </view-bin>

            <!-- insert empty space at end -->
            <div class="empty-space"></div>
        </div>
    </div>

    <!-- bottom bar -->
    <bottom-bar class="bottom-bar"></bottom-bar>

    <!-- rename notebook dialog pop up-->
    <popup-rename-notebook style="bottom: 30vh;" ng-show="dialog_flags.show_rename_notebook_popup" class="popup">
    </popup-rename-notebook>

    <!-- toast message -->
    <div ng-class="{show:is_toast_visible}" class="toast transition text-center capitalize bg-blur">{{toast_msg}}
    </div>

    <!-- end of dialog controller -->
    <!-- sidebar -->
    <side-bar ng-controller="sidebar_controller" ng-show="show_dialog" ng-click="show_dialog=false;" class="popup">
    </side-bar>



    <!-- import/export db popup -->
    <popup-db ng-controller="db_controller" style="top: 20vh;" class="popup" ng-show="show_dialog">
    </popup-db>

    <!-- passwrord popup -->
    <popup-password style="bottom: 30vh;" ng-show="show_dialog" ng-click="show_dialog=false;"
        ng-controller="passwrord_popup_controller" ng-init="init()" class="popup">
    </popup-password>

    <!-- create-notebook-popup -->
    <create-notebook-popup ng-init="init()" ng-controller="create_notebook_dialog_controller" style="bottom: 30vh;"
        class="popup" ng-show="show_dialog" ng-click="show_dialog=false;">
    </create-notebook-popup>

    <!-- more options panel for notebook-->
    <div
        ng-init="init()" ng-controller="notebook_more_options_controller" class="list-more-options-container"
        ng-show="show_dialog"
        ng-click="show_dialog=false;">
        <div class="chip">
            {{current_notebook.icon}} {{current_notebook.title}}
        </div>
        <div class="list-more-optionas-holder popup_style">
            <div
                ng-repeat="option in notebook_more_options" ng-click="option.action()" class="task-more-options-item">
                    <div>{{option.text}}</div>
            </div>
        </div>

    </div>

    <!-- more options panel for note-->
    <div ng-init="init()" ng-controller="note_more_options_controller" class="list-more-options-container"
        ng-click="show_dialog=false;" ng-show="show_dialog">
        <div class="list-more-optionas-holder popup_style">
            <div ng-repeat="option in note_more_options" ng-click="option.action()" class="task-more-options-item">
                <div>{{option.text}}</div>
            </div>
        </div>
    </div>

    <!-- create note menu -->
    <div ng-init="init()" ng-controller="create_note_menu_controller" class="text-menu-container" ng-show="show_dialog"
        ng-click="show_dialog=false;">
        <div class="text-menu-container-child popup_style">
            <div ng-repeat="option in sub_menu"
                ng-click="option.action(); dialog_flags.show_edit_note_more_options=false;" class="text-menu-item">
                <div>{{option.text}}</div>
            </div>
        </div>
    </div>


    <!-- notebooks list for various options -->
    <quick-notebooks class="list-more-options-container" ng-controller="quick_notebooks_controller" ng-init="init()"
        ng-show="show_dialog" ng-click="show_dialog=false">
    </quick-notebooks>






    <!-- <script src="/app.js"></script> -->
    <!-- angular module file -->
    <script src="./scripts/angular.min.js"></script>
    <script defer="" src="./scripts/sortable.min.js"></script>
    <script defer="" src="./scripts/angular-sanitize.min.js"></script>
    <script defer="" src="./scripts/crypto-js.min.js"></script>
    <script defer="" src="./scripts/aes.min.js"></script>
    <script defer="" src="./scripts/chart.min.js"></script>

    <!--load services -->
    <script type="text/javascript" src="scripts/services/db_service.js"></script>
    <script type="text/javascript" src="scripts/services/notebook_service.js"></script>
    <script type="text/javascript" src="scripts/services/note_service.js"></script>
    <script type="text/javascript" src="scripts/services/graph_service.js"></script>

    <!-- list and task classes -->
    <script type="text/javascript" src="scripts/list.js"></script>
    <script type="text/javascript" src="scripts/task.js"></script>


    <!-- main js files for production and development -->
    <!-- development -->
    <script type="text/javascript" src="scripts/wiki.js"></script>
    <script type="text/javascript" src="scripts/utilities.js"></script>
    <script type="text/javascript" src="scripts/main_controller.js"></script>
    <script type="text/javascript" src="scripts/dialog_controller.js">
    </script>
    <script type="text/javascript" src="scripts/create_notebook_dialog_controller.js"></script>
    <script type="text/javascript" src="scripts/notebook_more_options_controller.js"></script>
    <script type="text/javascript" src="scripts/share_service.js"></script>
    <script type="text/javascript" src="scripts/password_popup_controller.js"></script>
    <script type="text/javascript" src="scripts/note_more_options_controller.js"></script>
    <script type="text/javascript" src="scripts/create_note_menu_controller.js"></script>
    <script type="text/javascript" src="scripts/create_note_controller.js"></script>
    <script type="text/javascript" src="scripts/quick_notebooks_controller.js"></script>
    <script type="text/javascript" src="scripts/db_controller.js"></script>
    <script type="text/javascript" src="scripts/tag_controller.js"></script>
    <script type="text/javascript" src="scripts/sidebar_controller.js"></script>
    <script type="text/javascript" src="scripts/var_controller.js"></script>
    <script type="text/javascript" src="scripts/bin_controller.js"></script>
    <script type="text/javascript" src="scripts/wiki.js"></script>
    

    <script src="scripts/angular_module.js"></script>
</body>

</html>
